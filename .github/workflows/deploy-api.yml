# CD — deploy da API na VPS (self-hosted runner + git pull).
#
# Roda NO servidor (pasta ~/actions-runner), sem SCP/SSH da nuvem.
#
# Secrets / Variables:
#   DEPLOY_PATH  — pasta do projeto (ex.: /home/tpescolar/clone-discord)
#                  pode ser secret OU variable (vars.DEPLOY_PATH)
#
# Na VPS: clone git do repo + .env.production + runner online.

name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  changes:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.result.outputs.api }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy manual (ignora filtro de paths)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "api=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'workflow_run'
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'infra/docker/**'
              - '.github/workflows/deploy-api.yml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.dockerignore'

      - id: result
        run: |
          if [ "${{ steps.manual.outputs.api }}" = "true" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

  skip-notice:
    needs: changes
    if: needs.changes.outputs.api != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Nenhum deploy necessário
        run: |
          echo "::notice::Deploy API ignorado — o commit não alterou API/shared/docker."
          echo "Para forçar: Actions → Deploy API → Run workflow"

  deploy:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: self-hosted
    environment: production

    steps:
      - name: Verificar caminho e runner
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
        run: |
          echo "=== Debug deploy (self-hosted) ==="
          echo "hostname: $(hostname)"
          echo "user: $(whoami)"
          echo "pwd: $(pwd)"
          echo "DEPLOY_SHA: ${DEPLOY_SHA}"
          echo "DEPLOY_PATH: ${DEPLOY_PATH:-[VAZIO]}"
          if [ -z "${DEPLOY_PATH}" ]; then
            echo "ERRO: configure DEPLOY_PATH (Secret ou Variable)"
            echo "Ex.: /home/tpescolar/clone-discord"
            exit 1
          fi
          if [ ! -d "${DEPLOY_PATH}" ]; then
            echo "ERRO: pasta não existe: ${DEPLOY_PATH}"
            exit 1
          fi
          echo "DEPLOY_PATH existe: OK"
          echo "=== Fim debug ==="

      - name: Git pull (preserva .env.production)
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
        run: |
          set -euo pipefail
          cd "${DEPLOY_PATH}"

          ENV_FILE="infra/docker/.env.production"
          ENV_BACKUP="/tmp/concord-env.production.backup.$$"

          if [ -f "${ENV_FILE}" ]; then
            cp -a "${ENV_FILE}" "${ENV_BACKUP}"
            echo "Backup .env.production → ${ENV_BACKUP}"
          else
            echo "AVISO: ${ENV_FILE} ainda não existe na VPS"
            ENV_BACKUP=""
          fi

          if [ ! -d .git ]; then
            echo "ERRO: ${DEPLOY_PATH} não é um repositório git."
            echo "Na VPS: git clone git@github.com:Victor-Hug0/concord.git ${DEPLOY_PATH}"
            exit 1
          fi

          echo "remote: $(git remote get-url origin)"
          git fetch origin main
          git reset --hard "origin/main"
          # Preferir o SHA do CI quando disponível
          if [ -n "${DEPLOY_SHA}" ] && git rev-parse --verify "${DEPLOY_SHA}^{commit}" >/dev/null 2>&1; then
            git checkout --force "${DEPLOY_SHA}"
            echo "checkout SHA: ${DEPLOY_SHA}"
          else
            echo "usando origin/main: $(git rev-parse HEAD)"
          fi

          if [ -n "${ENV_BACKUP}" ] && [ -f "${ENV_BACKUP}" ]; then
            mkdir -p infra/docker
            cp -a "${ENV_BACKUP}" "${ENV_FILE}"
            rm -f "${ENV_BACKUP}"
            echo ".env.production restaurado"
          fi

          test -f "${ENV_FILE}" || { echo "Falta ${ENV_FILE}"; exit 1; }
          ls -la apps/api/src/auth/google-auth.guard.ts 2>/dev/null \
            && echo "google-auth.guard.ts presente" \
            || echo "WARN: google-auth.guard.ts ausente"

      - name: Build e reiniciar API
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
        run: |
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          export DEPLOY_SHA

          echo "=== Deploy API ==="
          echo "path: ${DEPLOY_PATH}"
          echo "sha:  ${DEPLOY_SHA}"

          docker compose -f infra/docker/docker-compose.prod.yml \
            --env-file infra/docker/.env.production \
            build --no-cache api

          docker compose -f infra/docker/docker-compose.prod.yml \
            --env-file infra/docker/.env.production \
            up -d --force-recreate --wait api

          echo "Health local:"
          curl -s http://127.0.0.1:3000/health
          echo ""

          if ! curl -sf "http://127.0.0.1:3000/health" | grep -q "${DEPLOY_SHA}"; then
            echo "ERRO: /health não contém o SHA esperado (${DEPLOY_SHA})"
            docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file infra/docker/.env.production logs api --tail 80
            exit 1
          fi
          echo "Deploy confirmado — SHA no container bate com o commit."
