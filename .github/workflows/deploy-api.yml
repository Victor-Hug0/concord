# CD — deploy da API na VPS após CI passar na main (ou manual).
#
# Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH
# Opcional: SSH_PORT (padrão 22)

name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  changes:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.result.outputs.api }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy manual (ignora filtro de paths)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "api=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'workflow_run'
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'infra/docker/**'
              - '.github/workflows/deploy-api.yml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.dockerignore'

      - id: result
        run: |
          if [ "${{ steps.manual.outputs.api }}" = "true" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
          fi

  skip-notice:
    needs: changes
    if: needs.changes.outputs.api != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Nenhum deploy necessário
        run: |
          echo "::notice::Deploy API ignorado — o commit não alterou API/shared/docker."
          echo "Para forçar: Actions → Deploy API → Run workflow"

  deploy:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Verificar secrets (debug)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_SHA: ${{ needs.changes.outputs.sha }}
        run: |
          echo "=== Debug deploy (valores sensíveis podem aparecer como *** no log) ==="
          echo "DEPLOY_SHA: ${DEPLOY_SHA}"
          echo "SSH_HOST: ${SSH_HOST:-[VAZIO]}"
          echo "SSH_USER: ${SSH_USER:-[VAZIO]}"
          echo "DEPLOY_PATH: ${DEPLOY_PATH:-[VAZIO]}"
          echo "SSH_PORT: ${SSH_PORT:-22}"
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "SSH_PRIVATE_KEY: [VAZIO] — secret não configurado"
            exit 1
          fi
          echo "SSH_PRIVATE_KEY: definido (${#SSH_PRIVATE_KEY} caracteres)"
          if printf '%s' "$SSH_PRIVATE_KEY" | head -1 | grep -q 'BEGIN'; then
            echo "SSH_PRIVATE_KEY: formato OK (linha -----BEGIN...)"
          else
            echo "SSH_PRIVATE_KEY: ERRO — deve começar com -----BEGIN OPENSSH PRIVATE KEY----- ou -----BEGIN RSA PRIVATE KEY-----"
            exit 1
          fi
          if printf '%s' "$SSH_PRIVATE_KEY" | tail -1 | grep -q 'END'; then
            echo "SSH_PRIVATE_KEY: termina com -----END... (OK)"
          else
            echo "SSH_PRIVATE_KEY: AVISO — última linha não é -----END... (chave truncada?)"
          fi
          echo "=== Fim debug ==="

      - name: Enviar código para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "apps/,packages/,infra/,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,tsconfig.base.json,.dockerignore"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true

      - name: Build e reiniciar API na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_SHA="${{ needs.changes.outputs.sha }}"
            echo "=== Deploy API ==="
            echo "path: ${DEPLOY_PATH}"
            echo "sha:  ${DEPLOY_SHA}"
            cd "${DEPLOY_PATH}"
            test -f infra/docker/.env.production || { echo "Falta infra/docker/.env.production"; exit 1; }
            test -f apps/api/src/auth/google-auth.guard.ts && echo "google-auth.guard.ts presente" || echo "WARN: google-auth.guard.ts ausente no disco"
            export DEPLOY_SHA
            docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file infra/docker/.env.production \
              build --no-cache api
            docker compose -f infra/docker/docker-compose.prod.yml \
              --env-file infra/docker/.env.production \
              up -d --force-recreate --wait api
            echo "Health local:"
            curl -s http://127.0.0.1:3000/health
            echo ""
            if ! curl -sf "http://127.0.0.1:3000/health" | grep -q "${DEPLOY_SHA}"; then
              echo "ERRO: /health não contém o SHA esperado (${DEPLOY_SHA})"
              docker compose -f infra/docker/docker-compose.prod.yml \
                --env-file infra/docker/.env.production logs api --tail 80
              exit 1
            fi
            echo "Deploy confirmado — SHA no container bate com o commit."
