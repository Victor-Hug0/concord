# Release desktop — Windows (.exe) + Linux (AppImage/.deb) na GitHub Release.
#
# Dispara após CI passar na main, tag desktop-v*, ou manual (Run workflow).
# Versão auto: MAJOR.MINOR do package.json + run number (ex.: 0.1.42).

name: Release desktop

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  gate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: ubuntu-latest
            script: release:linux

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Set release version
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const ref = process.env.GITHUB_REF || '';
          let version;
          if (ref.startsWith('refs/tags/desktop-v')) {
            version = ref.slice('refs/tags/desktop-v'.length);
          } else {
            const [maj, min] = pkg.version.split('.');
            version = `${maj}.${min}.${process.env.RUN_NUMBER}`;
          }
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          if (process.env.GITHUB_ENV) {
            fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\n`);
          }
          console.log(`Building desktop v${version}`);
          NODE

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @concord/shared build

      - name: Release desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          VITE_API_URL: https://concord.televei.dev
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pnpm --filter @concord/desktop ${{ matrix.script }}
