# Release desktop — Windows (.exe) + Linux (AppImage/.deb) na GitHub Release.
#
# Dispara automaticamente após CI passar na main (se mudou desktop/shared).
# Também: tag desktop-v* ou Actions → Run workflow.
#
# Versão auto (merge na main): MAJOR.MINOR do package.json + run number (ex.: 0.1.42).
# Versão manual (tag): desktop-v1.2.3 → 1.2.3

name: Release desktop

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  changes:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.result.outputs.desktop }}
    steps:
      - name: Release all (manual or tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
        id: force
        run: echo "desktop=true" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'workflow_run'
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/**'
              - 'packages/shared/**'
              - '.github/workflows/release-desktop.yml'

      - id: result
        run: |
          if [ "${{ steps.force.outputs.desktop }}" = "true" ]; then
            echo "desktop=true" >> $GITHUB_OUTPUT
          else
            echo "desktop=${{ steps.filter.outputs.desktop }}" >> $GITHUB_OUTPUT
          fi

  release:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: ubuntu-latest
            script: release:linux

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Set release version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/desktop-v}"
          else
            MAJMIN=$(node -p "require('./apps/desktop/package.json').version.split('.').slice(0,2).join('.')")
            VERSION="${MAJMIN}.${{ github.run_number }}"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          node -e "
            const fs = require('fs');
            const p = 'apps/desktop/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Building desktop v${VERSION}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @concord/shared build

      - name: Release desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          VITE_API_URL: https://concord.televei.dev
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: pnpm --filter @concord/desktop ${{ matrix.script }}
